<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UIMS Sync Bridge (Official)</title>
</head>
<body>
  <script>
    window.addEventListener('message', (event) => {
      try {
        const data = event.data;
        if (!data || !data.type) return;

        if (data.type === 'SAVE_COMPLAINT' && data.complaint) {
          const existingStr = localStorage.getItem('uims_complaints');
          const existing = existingStr ? JSON.parse(existingStr) : [];
          // Avoid duplicate by ID
          const filtered = existing.filter(c => c.id !== data.complaint.id);
          const updated = [data.complaint, ...filtered];
          localStorage.setItem('uims_complaints', JSON.stringify(updated));

          // Notify any listening tabs on port 5173
          window.dispatchEvent(new Event('storage'));
          if (window.BroadcastChannel) {
            const bc = new BroadcastChannel('uims_complaints_channel');
            bc.postMessage({ type: 'COMPLAINT_ADDED', complaint: data.complaint });
            bc.close();
          }

          if (event.source) {
            event.source.postMessage({ type: 'COMPLAINT_SYNC_ACK', success: true }, event.origin || '*');
          }
        } else if (data.type === 'SYNC_ALL_COMPLAINTS' && Array.isArray(data.complaints)) {
          localStorage.setItem('uims_complaints', JSON.stringify(data.complaints));
          window.dispatchEvent(new Event('storage'));
        }
      } catch (err) {
        console.error('Error in UIMS Sync Bridge (5173):', err);
      }
    });
  </script>
</body>
</html>
