version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: uims-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: uims
      MYSQL_USER: uims_user
      MYSQL_PASSWORD: uims_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
