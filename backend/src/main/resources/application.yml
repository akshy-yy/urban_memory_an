spring:
  application:
    name: uims-backend
  datasource:
    url: jdbc:mysql://localhost:3306/uims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: uims_user
    password: uims_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
